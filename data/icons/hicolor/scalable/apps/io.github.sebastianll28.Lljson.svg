<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- Dos paneles lado a lado -->
  <rect x="20" y="26" width="42" height="78" rx="9" fill="url(#card)"/>
  <rect x="66" y="26" width="42" height="78" rx="9" fill="url(#card)"/>
  <!-- Panel izquierdo: líneas iguales y una eliminada -->
  <rect x="27" y="36" width="20" height="6" rx="3" fill="#77767b"/>
  <rect x="33" y="50" width="26" height="6" rx="3" fill="#c0bfbc"/>
  <rect x="27" y="62" width="28" height="12" rx="4" fill="#e01b24" fill-opacity=".85"/>
  <rect x="33" y="82" width="22" height="6" rx="3" fill="#c0bfbc"/>
  <rect x="27" y="94" width="10" height="4" rx="2" fill="#77767b"/>
  <!-- Panel derecho: líneas iguales, una añadida y una modificada -->
  <rect x="73" y="36" width="20" height="6" rx="3" fill="#77767b"/>
  <rect x="79" y="50" width="26" height="6" rx="3" fill="#c0bfbc"/>
  <rect x="73" y="62" width="28" height="12" rx="4" fill="#2ec27e"/>
  <rect x="79" y="82" width="22" height="6" rx="3" fill="#f5c211"/>
  <rect x="73" y="94" width="10" height="4" rx="2" fill="#77767b"/>
</svg>
