[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

# Versions pinned in SPEC.md. Do not update without approval.
[workspace.dependencies]
lljson-core = { path = "crates/core" }

# UI
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
glib = "0.22.10"
gio = "0.22.10"
async-channel = "2.5.0"

# Core
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simd-json = "0.19.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
ahash = "0.8.12"
memmap2 = "0.9.12"
thiserror = "2.0.21"
regex = "1.13.1"

# Binaries
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

# Benchmarks
criterion = "0.8.2"

# Post-MVP
jaq-core = "3.1.2"
jaq-std = "3.0.4"
jaq-json = "2.0.3"
